name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['8.17.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/test_unit.js
      - run: python3 tools/store_build.py --preview-only rubenrios_gearhud
      - run: node tools/test_e2e.js "$PWD/dist/rubenrios_gearhud" "$PWD/kit/tools" /tmp
